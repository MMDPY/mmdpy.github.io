    body.orange { --ink: #ff6a3d; --sel: #ff6a3d; }
    body.amber { --ink: #ffb000; --sel: #ffb000; --fg: #e8c88a; --hi: #ffe3a8; --dim: #8a7550; --link: #e8c88a; }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 14px/1.6 var(--mono);
      -webkit-font-smoothing: antialiased;
      display: grid; grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;

    ::selection { background: var(--sel); color: var(--bg); }
    a { color: var(--link); text-decoration: underline; text-decoration-color: var(--dim); text-underline-offset: 3px; text-decoration-thickness: 1px; }
    a:hover { color: var(--bg); background: var(--ink); text-decoration: none; }
    b, .hi { color: var(--hi); font-weight: 600; }
    .dim { color: var(--dim); }
    .ink { color: var(--ink); }
    .err { color: var(--ink); }

    main { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 0; }

    /* ---------- left column ---------- */
    .side { padding: 28px 24px 20px 28px; border-right: 1px solid var(--rule); overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
    .me { position: relative; margin: 0; width: 196px; aspect-ratio: 540 / 620; cursor: crosshair; }
    .me img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; opacity: 0; filter: grayscale(.15) contrast(1.05); }
    .me .dith { position: absolute; inset: 0; background: var(--ink); -webkit-mask: var(--m) 0 0 / 100% 100% no-repeat; mask: var(--m) 0 0 / 100% 100% no-repeat; }
    .me:hover img, .me.real img { opacity: 1; }
    .me:hover .dith, .me.real .dith { opacity: 0; }
    .me figcaption { position: absolute; left: 0; bottom: -20px; font-size: 11px; color: var(--dim); }
    .side h1 { margin: 10px 0 0; font-size: 15px; font-weight: 600; color: var(--hi); letter-spacing: 0; }
    .side p { margin: 0; }
    .side .links { list-style: none; margin: 0; padding: 0; max-width: 30ch; }
    .side .links li { display: flex; justify-content: space-between; }
    .side .links span { color: var(--dim); }
    .side .foot { margin-top: auto; font-size: 11.5px; color: var(--dim); }

    /* ---------- terminal ---------- */
    #screen { overflow-y: auto; padding: 24px 32px 16px; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
    #screen:focus { outline: none; }
    #out { max-width: 96ch; }
    .ln { white-space: pre-wrap; word-break: break-word; min-height: 1.6em; }
    .ps1 .u { color: var(--ink); }
    #input-row { display: flex; align-items: baseline; max-width: 96ch; }
    #input-row[hidden] { display: none; }
    #cmd { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--hi); font: inherit; padding: 0 0 0 1ch; caret-color: var(--ink); }

    .man-hd { display: flex; justify-content: space-between; color: var(--dim); margin-bottom: 1.6em; }
    .sec { color: var(--hi); font-weight: 600; }
    .ind { padding-left: 7ch; }
    .ind p { margin: 0 0 .9em; }

    .job { margin: 0 0 1.4em; }
    .job .hd { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 2ch; }
    .job ul { margin: .2em 0 0; padding: 0; list-style: none; }
    .job li { padding-left: 2ch; text-indent: -2ch; }
    .job li::before { content: "- "; color: var(--dim); }

    .sys { display: grid; grid-template-columns: 28ch 16ch 1fr; gap: 0 2ch; }
    .sys > div { padding-bottom: .7em; }
    .sys .h { color: var(--dim); border-bottom: 1px solid var(--rule); margin-bottom: .5em; padding-bottom: .15em; }
    .sys .n { color: var(--hi); }
    .sys .m { color: var(--ink); }
    .ls { display: grid; grid-template-columns: auto auto 1fr; gap: 0 2ch; }
    .kv { display: grid; grid-template-columns: 12ch 1fr; gap: 0 2ch; }
    .kv > :nth-child(odd) { color: var(--dim); }

    .neo { display: flex; gap: 4ch; align-items: flex-start; flex-wrap: wrap; }
    .print { display: block; background: var(--ink); -webkit-mask: var(--m) 0 0 / 100% 100% no-repeat; mask: var(--m) 0 0 / 100% 100% no-repeat; }
    .blocks span { display: inline-block; width: 3ch; height: 1.1em; vertical-align: middle; }

    /* ---------- tmux-ish status line ---------- */
    .status { display: flex; gap: 0; background: var(--bar); color: var(--bar-fg); font-size: 12.5px; line-height: 22px; white-space: nowrap; overflow-x: auto; scrollbar-width: none; user-select: none; }
    .status::-webkit-scrollbar { display: none; }
    .status .sess { padding: 0 1.2ch; font-weight: 600; }
    .status button { font: inherit; color: inherit; background: none; border: 0; padding: 0 1ch; cursor: pointer; }
    .status button:hover, .status button.on { background: var(--bar-fg); color: var(--bar); }
    .status .r { margin-left: auto; padding: 0 1.2ch; }

    @media (max-width: 860px) {
      body { overflow: auto; display: block; }
      main { display: block; }
      .side { border-right: 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 104px 1fr; gap: 4px 18px; padding: 18px; overflow: visible; }
      .me { width: 104px; grid-row: span 4; }
      .me figcaption, .side .foot { display: none; }
      .side h1 { margin: 0; }
      #screen { height: auto; min-height: 70vh; overflow: visible; padding: 18px; }
      .status { position: sticky; bottom: 0; }
      .sys { grid-template-columns: 1fr auto; }
      .sys .d { grid-column: 1 / -1; padding-top: 0; margin-top: -.6em; }
      .sys .h:nth-child(3) { display: none; }
      .ind { padding-left: 3ch; }
    }
    @media (max-width: 520px) {

      .kv { grid-template-columns: 9ch 1fr; }

  <script>

    const scroll = () => { if (paneScrolls()) screen.scrollTop = screen.scrollHeight; };

    // ---------- 1-bit portrait (Atkinson dither) ----------
    const photo = new Image();
    photo.src = PHOTO;
    const photoReady = new Promise(r => { photo.onload = r; photo.onerror = r; });
    async function dither(cols, px) {
      await photoReady;
      if (!photo.naturalWidth) return null;
      const s = photo.naturalWidth / 800;
      const [sx, sy, sw, sh] = [130 * s, 10 * s, 540 * s, 620 * s];
      const rows = Math.round(cols * sh / sw);
      const c = document.createElement("canvas");
      c.width = cols; c.height = rows;
      const x = c.getContext("2d", { willReadFrequently: true });
      x.drawImage(photo, sx, sy, sw, sh, 0, 0, cols, rows);
      const img = x.getImageData(0, 0, cols, rows), d = img.data;
      const g = new Float32Array(cols * rows);
      for (let i = 0; i < g.length; i++) {
        const v = .299 * d[i * 4] + .587 * d[i * 4 + 1] + .114 * d[i * 4 + 2];
        g[i] = Math.max(0, Math.min(255, (v - 118) * 1.35 + 128));
      }
      const spread = [[1, 0], [2, 0], [-1, 1], [0, 1], [1, 1], [0, 2]];
      for (let y = 0; y < rows; y++) for (let xx = 0; xx < cols; xx++) {
        const i = y * cols + xx, o = g[i] < 128 ? 0 : 255, e = (g[i] - o) / 8;
        g[i] = o;
        for (const [dx, dy] of spread) {
          const nx = xx + dx, ny = y + dy;
          if (nx >= 0 && nx < cols && ny < rows) g[ny * cols + nx] += e;
        }
      }
      const dpr = Math.min(2, devicePixelRatio || 1), k = px * dpr;
      const big = document.createElement("canvas");
      big.width = cols * k; big.height = rows * k;
      const bx = big.getContext("2d");
      bx.fillStyle = "#000";
      for (let y = 0; y < rows; y++) for (let xx = 0; xx < cols; xx++) if (g[y * cols + xx]) bx.fillRect(xx * k, y * k, k, k);
      return { url: big.toDataURL(), w: cols * px, h: rows * px };
    }
    async function printed(cols, px) {
      const p = await dither(cols, px);
      if (!p) return `<span class="dim">(couldn't load the photo)</span>`;
      return `<span class="print" role="img" aria-label="dithered portrait of Mohammad" style="--m:url(${p.url});width:${p.w}px;height:${p.h}px"></span>`;

    dither(98, 2).then(p => { if (p) document.querySelector(".me .dith").style.setProperty("--m", `url(${p.url})`); });
    document.getElementById("me").addEventListener("click", e => e.currentTarget.classList.toggle("real"));

    // ---------- content (all from the résumé) ----------
    const WORK = [
      {

          `Architected a <b>sub-second speech-to-speech multi-agent system</b> for Compliance Investigator. One context layer over knowledge graphs, entity resolution and parallel LLM subagents, for real-time investigative Q&amp;A.`,
          `Built a cascaded agentic decisioning pipeline for Supervision (classical ML filters, then tool-calling LLMs, then human-in-the-loop active learning). Inference cost <b>~15x lower</b> than AWS Bedrock.`,
          `Distilled frontier-model reasoning into a QLoRA-tuned open-weight LLM that beat commercial compliance baselines on golden evals at <b>10x lower cost</b>. Took AWS Nova F1 up <b>40%</b> with structured function calling and GEPA.`,
          `Designed a petabyte-scale hybrid RAG engine over millions of archived emails (dense + BM25 + cross-encoder re-ranker): <b>94% top-5 recall</b>, search latency down <b>65%</b>.`,
          `Serve <b>20+ open-weight models</b> on Kubernetes with vLLM, AWQ, KV caching and continuous batching, <b>10x</b> cheaper than Bedrock. Also a BERT + rules PII redaction API, <b>122x</b> cheaper than AWS Guardrails.`,
          `Fine-tuned Longformer for regulated long documents (<b>90%+ F1</b>) with token-level Integrated Gradients, so reviewers can audit every call.`,
        ],
      },
      {
        role: "Senior Data Scientist", where: "KPMG Lighthouse", loc: "Toronto", when: "Jun 2023 - Jul 2025",
        items: [
          `Moved <b>Prudential Financial</b> from on-prem to GCP and added agentic LLMs + RAG for context-aware database queries.`,
          `Generative SOC-report system on GCP with instruction-tuned local LLMs, <b>92%+</b> accuracy on retrieval from unstructured reports.`,
          `Nine production churn pipelines for <b>Bell</b> on Vertex AI, ingestion to batch deployment (Cloud Composer, Pub/Sub, BigQuery).`,
        ],
      },
      {
        role: "Associate ML Developer", where: "AltaML", loc: "Edmonton", when: "Sep 2022 - May 2023",
        items: [
          `Shipped a bias and hate-speech classifier on Azure with GPT-3.5.`,

      {
        role: "Data Scientist, NLP Researcher", where: "University of Alberta", loc: "Edmonton", when: "Jan 2021 - Aug 2022",
        items: [`Language models that catch ungrammatical learner writing at <b>97%+</b> accuracy. Published in IJAIED (2025).`],

        items: [`Imagery pipeline and a Faster R-CNN detector for object recognition.`],

    const SYSTEMS = [

      ["booking_probability_prediction", "will this hotel get booked, from search sessions"],

    const FILES = {

    const cmds = {
      man(arg) {

      about(inMan) {

          <p>Most of my work is making these things cheap enough to run. Serving our own models has come out <b>10x to 122x</b> cheaper than the managed AWS equivalents.</p>
          <p class="dim">Before Proofpoint: KPMG Lighthouse, AltaML, NLP research at the University of Alberta (M.Sc. CS), and the Iranian national robotics team. 12+ years in. Published in IJAIED, taught ML to 15+ students, certified GCP ML Engineer and Azure AI Engineer.</p>

      },
      whoami() { print("mmdpy"); },
      work() {
        WORK.forEach(j => print(`<div class="job">
          <div class="hd"><span><b>${j.role}</b>, ${j.where} <span class="dim">(${j.loc})</span></span><span class="dim">${j.when}</span></div>

      },
      oss() {
        print(`<span class="dim">total ${OSS.length}  (older, public, github.com/mmdpy)</span>`);
        print(`<div class="ls">${OSS.map(([n, d]) => `<span class="perm dim">drwxr-xr-x</span><a href="${GH}/${n}" target="_blank" rel="noopener">${n}/</a><span class="dim">${d}</span>`).join("")}</div>`, "");
      },
      projects() { cmds.systems(); print(""); cmds.oss(); },
      skills() {
        print(`<div class="kv">${SKILLS.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join("")}</div>`, "");
      },
      paper() {
        print(`Karimi Abdolmaleki, M., Farias Wanderley, L., Cutumisu, M., et al.`);
        print(`<b>Negative Language Transfer Identification in the English Writing of Chinese and Farsi Native Speakers.</b>`);
        print(`<i>International Journal of Artificial Intelligence in Education</i>, 2025.  <a href="${DOI}" target="_blank" rel="noopener">doi:10.1007/s40593-025-00468-8</a>`);
        print(``);
        print(`<span class="dim">also: taught an advanced ML course (NLP + MLOps) to 15+ students at the Alberta AI Association.</span>`);
      },
      contact() {
        print(`<div class="kv">
          <span>email</span><span><a href="mailto:${EMAIL}">${EMAIL}</a></span>
          <span>linkedin</span><span><a href="${LI}" target="_blank" rel="noopener">in/mohammad-karimi-abdolmaleki</a></span>
          <span>github</span><span><a href="${GH}" target="_blank" rel="noopener">github.com/mmdpy</a></span>
          <span>where</span><span>Toronto, ON</span>
        </div>`, "");
        print(`<span class="dim">email is fastest. I read everything.</span>`);
      },
      resume() {
        print(`opening resume.pdf <span class="dim">(blocked? <a href="${RESUME}" target="_blank" rel="noopener">here</a>)</span>`);
        window.open(RESUME, "_blank", "noopener");
      },
      async neofetch() {
        const hold = print(`<span class="dim">...</span>`, "");
        const art = await printed(64, 2);
        const info = [
          ["", `<b>mmdpy</b>@<b>proofpoint</b>`],
          ["", `<span class="dim">----------------</span>`],
          ["name", "Mohammad Karimi"],
          ["role", "Staff AI Engineer"],
          ["since", "Jul 2025"],
          ["home", "Toronto, ON"],
          ["edu", "M.Sc. CS, UAlberta"],
          ["load", "20M+ messages/day"],
          ["latency", "< 1 s speech-to-speech"],
          ["recall@5", "94%"],
          ["certs", "GCP ML Eng, Azure AI Eng"],
        ];
        const pal = ["#3a3935", "#8fd16a", "#ff6a3d", "#ffb000", "#6aa9ff", "#c792ea", "#5fd7d7", "#d9d5ca"];
        hold.innerHTML = `<div class="neo">${art}<div>${info.map(([k, v]) => k ? `<div><span class="ink">${k}</span>: ${v}</div>` : `<div>${v}</div>`).join("")}<div class="blocks" style="margin-top:.8em">${pal.map(c => `<span style="background:${c}"></span>`).join("")}</div></div></div>`;
        scroll();
      },
      async selfie() {
        const hold = print(`<span class="dim">...</span>`, "");
        const px = innerWidth < 520 ? 2 : 3;
        const cols = Math.max(80, Math.min(150, Math.floor((screen.clientWidth - 64) / px)));
        hold.innerHTML = `${await printed(cols, px)}<div class="dim" style="margin-top:.4em">${cols} columns, Atkinson dither, done in your browser from <a href="${PHOTO}" target="_blank">me.jpg</a></div>`;
        scroll();
      },
      help() {
        const rows = [
          ["man mmdpy", "the overview"], ["work", "where I've worked"], ["systems", "what I built at Proofpoint"],
          ["oss", "public repos"], ["skills", "the stack"], ["paper", "publication + teaching"],
          ["contact", "how to reach me"], ["resume", "the pdf"], ["neofetch", "you know"], ["selfie", "1-bit portrait"],
          ["ls, cat", "poke around"], ["theme", "default | orange | amber | paper"], ["clear", "ctrl+l works too"],
        ];
        print(`<div class="kv" style="grid-template-columns:14ch 1fr">${rows.map(([a, b]) => `<span>${cmdLink(a.split(",")[0].split(" ")[0] === "man" ? "man mmdpy" : a.split(",")[0], a)}</span><span class="dim">${b}</span>`).join("")}</div>`, "");
      },
      ls(arg) {
        const all = arg && arg.startsWith("-a");
        print(Object.keys(FILES).filter(f => all || !f.startsWith(".")).map(f => f.startsWith(".") ? `<span class="dim">${f}</span>` : f.endsWith("/") ? `<b>${f}</b>` : f).join("  "));
      },
      cat(arg) {
        if (!arg) return print(`usage: cat &lt;file&gt;`);
        const f = FILES[arg] || FILES[arg + "/"];
        f ? f() : print(`cat: ${esc(arg)}: No such file or directory`);
      },
      open(arg) { FILES[arg] ? FILES[arg]() : print(`usage: open me.jpg | resume.pdf`); },
      cd(arg) { arg && FILES[arg.replace(/\/?$/, "/")] ? FILES[arg.replace(/\/?$/, "/")]() : print(``); },
      pwd() { print("/home/mmdpy"); },
      date() { print(new Date().toString()); },
      echo(...a) { print(esc(a.join(" "))); },
      history() { hist.forEach((h, i) => print(`<span class="dim">${String(i + 1).padStart(5)}</span>  ${esc(h)}`)); },
      theme(arg) {
        const t = ["default", "orange", "amber", "paper"];
        if (!t.includes(arg)) return print(`usage: theme ${t.join(" | ")}`);
        document.body.className = arg === "default" ? "" : arg;
        localStorage.setItem("theme", arg);
      },
      clear() { out.innerHTML = ""; },
      sudo(...a) {
        if (/^hire/.test(a.join(" "))) {
          print(`[sudo] password for recruiter: `);
          setTimeout(() => print(`ok. <a href="mailto:${EMAIL}?subject=Hi%20Mohammad">${EMAIL}</a>`), reduced ? 0 : 900);
          return;
        }
        print(`mmdpy is not in the sudoers file. This incident will be reported.`);
      },
      vim() { print(`<span class="dim">~<br>~<br>~</span><br>"portfolio" [readonly]  type :q`); },
      ":q"() { print(``); },
      exit() { print(`logout<br><span class="dim">(you're still here though)</span>`); },
      rm(...a) { print(a.includes("-rf") ? `rm: refusing. there's a human in the loop.` : `rm: permission denied`); },
    };
    Object.assign(cmds, { experience: cmds.work, exp: cmds.work, proj: cmds.projects, research: cmds.paper, cv: cmds.resume, "?": cmds.help, ascii: cmds.selfie });

    const VISIBLE = ["man", "about", "work", "systems", "oss", "projects", "skills", "paper", "contact", "resume", "neofetch", "selfie", "help", "ls", "cat", "open", "theme", "clear", "history"];
    const hist = [];
    let hIdx = 0;

    function run(raw) {
      const line = raw.trim();
      const head = print(`${PS1} ${esc(line)}`);
      if (!line) return;
      hist.push(line); hIdx = hist.length;
      if (window.gtag) gtag("event", "terminal_command", { command: line.split(/\s+/)[0] });
      const [name, ...args] = line.split(/\s+/);
      const fn = cmds[name.toLowerCase()];
      const pin = () => requestAnimationFrame(() => {
        if (!paneScrolls()) return head.scrollIntoView({ block: "start", behavior: reduced ? "auto" : "smooth" });
        const top = head.getBoundingClientRect().top - screen.getBoundingClientRect().top + screen.scrollTop - 16;
        if (screen.scrollHeight - top > screen.clientHeight) screen.scrollTop = top;
      });
      document.querySelectorAll(".status button").forEach(b => b.classList.toggle("on", b.dataset.cmd.split(" ")[0] === name));
      if (fn) Promise.resolve(fn(...args)).then(() => { print(""); pin(); });
      else {
        const guess = VISIBLE.find(c => c.startsWith(name.toLowerCase().slice(0, 2)));
        print(`zsh: command not found: ${esc(name)}${guess ? `<span class="dim">. did you mean ${cmdLink(guess)}?</span>` : ""}`);
        print("");
      }
      pin();
    }

    // types like a person: uneven, a little faster mid-word
    async function typeCmd(c) {
      const d = print(`${PS1} `);
      for (const ch of c) {
        d.insertAdjacentText("beforeend", ch);
        await sleep(ch === " " ? 120 : 45 + Math.random() * 70);
      }
      await sleep(260);
      d.remove();
      run(c);
    }

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") { run(input.value); input.value = ""; }
      else if (e.key === "ArrowUp") { e.preventDefault(); if (hIdx > 0) input.value = hist[--hIdx]; }
      else if (e.key === "ArrowDown") { e.preventDefault(); hIdx < hist.length - 1 ? input.value = hist[++hIdx] : (hIdx = hist.length, input.value = ""); }
      else if (e.key === "Tab") {
        e.preventDefault();
        const [first, ...rest] = input.value.split(" ");
        if (rest.length && ["cat", "open", "theme"].includes(first)) {
          const pool = first === "theme" ? ["default", "orange", "amber", "paper"] : Object.keys(FILES);
          const m = pool.filter(f => f.startsWith(rest.join(" ")));
          if (m.length === 1) input.value = `${first} ${m[0]}`;
          else if (m.length) print(m.join("  "), "ln dim");
          return;
        }
        const m = VISIBLE.filter(c => c.startsWith(input.value));
        if (m.length === 1) input.value = m[0] + " ";
        else if (m.length > 1) print(m.join("  "), "ln dim");
      }
      else if (e.key === "l" && e.ctrlKey) { e.preventDefault(); cmds.clear(); }
    });

    const fine = matchMedia("(pointer: fine)").matches;
    const go = c => { run(c); if (fine) input.focus({ preventScroll: true }); };
    document.querySelectorAll(".status button").forEach(b => b.addEventListener("click", () => go(b.dataset.cmd)));
    out.addEventListener("click", e => {
      const a = e.target.closest("[data-run]");
      if (a) { e.preventDefault(); go(a.dataset.run); }
    });
    screen.addEventListener("click", e => { if (!e.target.closest("a") && !getSelection().toString() && !row.hidden) input.focus({ preventScroll: true }); });
    document.addEventListener("keydown", e => {
      if (row.hidden || e.metaKey || e.ctrlKey || e.altKey) return;
      if (document.activeElement !== input && /^[0-7]$/.test(e.key)) { e.preventDefault(); go(document.querySelectorAll(".status button")[+e.key].dataset.cmd); return; }
      if (document.activeElement !== input && e.key.length === 1) input.focus();
    });

    const clock = document.getElementById("clock");
    const tick = () => {
      const t = new Date();
      clock.textContent = `"toronto" ${t.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "America/Toronto" })} ${t.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "2-digit", timeZone: "America/Toronto" }).replace(/ /g, "-")}`;
    };
    tick(); setInterval(tick, 20000);

    const saved = localStorage.getItem("theme");
    if (saved && saved !== "default") document.body.className = saved;

    (async () => {
      print(`<span class="dim">Last login: ${new Date(Date.now() - 864e5 * 2).toUTCString().slice(0, 22)} on ttys001</span>`);
      await sleep(400);
      await typeCmd("man mmdpy");
      row.hidden = false;
      screen.scrollTop = 0;
      if (fine) input.focus({ preventScroll: true });
    })();
  })();
  </script>
</body>
</html>
