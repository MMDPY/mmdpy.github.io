      ".secrets": () => print(`<span class="err">permission denied:</span> nice try. try <span class="ac">sudo hire-me</span>`),
    };

    const cmds = {
      help() {
        const rows = [
          ["about", "who I am, in 20 seconds"],
          ["experience", "where I've shipped things"],
          ["projects", "production systems + open source"],
          ["skills", "what I'm dangerous at"],
          ["research", "publication + teaching"],
          ["neofetch", "system info, but it's me"],
          ["resume", "open the PDF"],
          ["contact", "email, LinkedIn, GitHub"],
          ["ls / cat", "poke around the filesystem"],
          ["theme", "green | amber | ice | mono"],
          ["clear", "wipe the screen"],
        ];
        print(`<div class="kv">${rows.map(([a, b]) => `<span>${a}</span><span class="dim">${b}</span>`).join("")}</div>`, "");
        print(`<span class="dim">psst — there are a few easter eggs.</span>`);
      },
      about() {
        print(`<span class="b">Mohammad Karimi</span> <span class="dim">—</span> <span class="ac">Staff AI Engineer @ Proofpoint</span> <span class="dim">· Toronto</span>`);
        print(``);
        print(`I build AI systems that hold up in production: <span class="ac">agents</span> that reason and use tools,`);
        print(`a <span class="ac">speech agent</span> that answers in under a second, <span class="ac">RAG</span> over millions of messages,`);
        print(`and inference stacks that run <span class="b">10–122× cheaper</span> than managed cloud services.`);
        print(``);
        print(`<div class="metrics">
          <div class="metric"><div class="n">20M+</div><div class="l">messages / day in prod</div></div>
          <div class="metric"><div class="n">&lt;1s</div><div class="l">speech-to-speech latency</div></div>
          <div class="metric"><div class="n">122×</div><div class="l">cheaper than AWS Guardrail</div></div>
          <div class="metric"><div class="n">94%</div><div class="l">top-5 recall, archive RAG</div></div>
        </div>`, "");
        print(`<span class="dim">8+ years · M.Sc. CS (UAlberta) · published NLP researcher · ML instructor · GCP ML Engineer + Azure AI Engineer certified</span>`);
      },
      whoami() { cmds.about(); },
      experience() {
        EXPERIENCE.forEach(e => print(`<div class="card">
          <div class="hd"><span><span class="role">${e.role}</span> <span class="dim">@</span> <span class="where">${e.where}</span> <span class="dim">· ${e.loc}</span></span><span class="when">${e.when}</span></div>
          <ul>${e.items.map(i => `<li>${i}</li>`).join("")}</ul>
          <div>${e.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
        </div>`, ""));
      },
      projects() {
        print(`<span class="ac">❯</span> <span class="b">production systems</span> <span class="dim">— built at work; descriptions only, code is proprietary</span>`);
        print(`<div class="proj">${SYSTEMS.map(p => `<div class="pc"><div class="k">${p.k}</div><div class="t">${p.t}</div><div class="m">${p.m}</div><div class="d">${p.d}</div></div>`).join("")}</div>`, "");
        print(`<span class="ac">❯</span> <span class="b">open source</span> <span class="dim">— github.com/mmdpy</span>`);
        print(`<div class="proj">${OSS.map(p => `<a class="pc" style="border-bottom:1px solid var(--line);display:block;color:inherit" href="${LINKS.github}/${p.u}" target="_blank" rel="noopener"><div class="k">repo ↗</div><div class="t">${p.t}</div><div class="m">${p.m}</div><div class="d">${p.d}</div></a>`).join("")}</div>`, "");
      },
      skills() {
        const bar = n => { const w = 28, f = Math.round(n / 100 * w); return "█".repeat(f) + `<span class="dim">${"░".repeat(w - f)}</span>`; };
        print(`<div class="bars">${SKILLS.map(([k, n, d]) => `<span class="ac2">${k}</span><span><span class="bar-v">${bar(n)}</span> <span class="dim">${d}</span></span>`).join("")}</div>`, "");
      },
      research() {
        print(`<span class="b">Publication</span>`);
        print(`Karimi Abdolmaleki, M., Farias Wanderley, L., Cutumisu, M., et al. <span class="ac">Negative Language Transfer Identification in the English Writing of Chinese and Farsi Native Speakers.</span> <i>Int. J. AI in Education</i> (2025). <a href="${LINKS.paper}" target="_blank" rel="noopener">doi ↗</a>`);
        print(``);
        print(`<span class="b">Teaching</span>`);
        print(`ML Instructor, Alberta AI Association — advanced ML course (NLP + MLOps) for 15+ students.`);
        print(`Guest speaker on ML for Action for Healthy Communities.`);
      },
      neofetch() {
        const logo = String.raw`      ▄▄▄▄▄▄▄
    ▄█▀▀   ▀▀█▄
   ██  ▄█ █▄  ██
   ██  ██▀██  ██
   ██  ▀▀ ▀▀  ██
    ▀█▄▄   ▄▄█▀
      ▀▀▀▀▀▀▀`;
        const up = Math.floor((Date.now() - new Date("2018-09-01")) / (365.25 * 864e5));
        const info = [
          [`<span class="ac b">mohammad</span><span class="dim">@</span><span class="ac2 b">toronto</span>`],
          [`<span class="dim">─────────────────</span>`],
          ["OS", "Human 1.0 (Toronto, ON)"],
          ["Host", "Proofpoint · Staff AI Engineer"],
          ["Uptime", `${up}+ years shipping ML`],
          ["Kernel", "PyTorch · vLLM · Transformers"],
          ["Shell", "agents + subagents + tools"],
          ["Throughput", "20M+ messages/day"],
          ["Latency", "< 1s speech-to-speech"],
          ["Cost", "10–122× under managed cloud"],
          ["Memory", "RAG · 94% recall@5"],
          ["Locale", "en_CA · fa_IR"],
        ];
        const sw = ["#ff5f57", "#febc2e", "#28c840", "var(--accent)", "var(--accent-2)", "#c3a6ff", "#fff"].map(c => `<span class="swatch" style="background:${c}"></span>`).join("");
        print(`<div class="neo"><pre>${logo}</pre><div>${info.map(r => r.length === 1 ? `<div>${r[0]}</div>` : `<div><span class="ac">${r[0]}</span>: ${r[1]}</div>`).join("")}<div style="margin-top:6px">${sw}</div></div></div>`, "");
      },
      resume() {
        print(`opening <span class="ac">resume.pdf</span> in a new tab… <span class="dim">(if nothing happens: <a href="${RESUME}" target="_blank" rel="noopener">click here</a>)</span>`);
        window.open(RESUME, "_blank", "noopener");
      },
      contact() {
        print(`<div class="kv">
          <span>email</span><span><a href="mailto:${EMAIL}">${EMAIL}</a></span>
          <span>linkedin</span><span><a href="${LINKS.linkedin}" target="_blank" rel="noopener">in/mohammad-karimi-abdolmaleki</a></span>
          <span>github</span><span><a href="${LINKS.github}" target="_blank" rel="noopener">github.com/mmdpy</a></span>
          <span>location</span><span>Toronto, ON · open to the right AI problem</span>
        </div>`, "");
      },
      email() { location.href = `mailto:${EMAIL}`; print(`opening mail client → <span class="ac">${EMAIL}</span>`); },
      github() { window.open(LINKS.github, "_blank", "noopener"); print(`→ <a href="${LINKS.github}" target="_blank">github.com/mmdpy</a>`); },
      linkedin() { window.open(LINKS.linkedin, "_blank", "noopener"); print(`→ <a href="${LINKS.linkedin}" target="_blank">LinkedIn</a>`); },
      ls(arg) {
        if (arg && arg.startsWith("-a")) return print(Object.keys(FILES).map(f => f.endsWith("/") ? `<span class="ac2">${f}</span>` : f.startsWith(".") ? `<span class="dim">${f}</span>` : f).join("   "));
        print(Object.keys(FILES).filter(f => !f.startsWith(".")).map(f => f.endsWith("/") ? `<span class="ac2">${f}</span>` : f).join("   "));
      },
      cat(arg) {
        if (!arg) return print(`<span class="err">cat:</span> missing file. try <span class="ac">ls</span>`);
        const f = FILES[arg] || FILES[arg + "/"];
        f ? f() : print(`<span class="err">cat: ${esc(arg)}: No such file or directory</span>`);
      },
      cd(arg) { arg && FILES[arg.replace(/\/?$/, "/")] ? cmds.projects() : print(`<span class="dim">you're already home.</span>`); },
      pwd() { print("/home/mohammad"); },
      date() { print(new Date().toString()); },
      echo(...a) { print(esc(a.join(" "))); },
      history() { hist.forEach((h, i) => print(`<span class="dim">${String(i + 1).padStart(4)}</span>  ${esc(h)}`)); },
      theme(arg) {
        const t = ["green", "amber", "ice", "mono"];
        if (!t.includes(arg)) return print(`usage: theme <span class="ac">${t.join(" | ")}</span>`);
        document.body.className = arg === "green" ? "" : arg;
        localStorage.setItem("theme", arg);
        print(`theme → <span class="ac">${arg}</span>`);
      },
      clear() { out.innerHTML = ""; },
      sudo(...a) {
        if (a.join(" ") === "hire-me" || a.join(" ") === "hire mohammad") {
          print(`<span class="dim">[sudo] password for recruiter: ********</span>`);
          setTimeout(() => {
            print(`<span class="ac glow b">✓ access granted.</span> excellent judgment.`);
            print(`→ <a href="mailto:${EMAIL}?subject=Let's%20talk">${EMAIL}</a>  ·  <a href="${RESUME}" target="_blank">resume.pdf</a>`);
            matrix(2600);
          }, reduced ? 0 : 700);
          return;
        }
        print(`<span class="err">mohammad is not in the sudoers file.</span> this incident will be reported. <span class="dim">(try: sudo hire-me)</span>`);
      },
      "hire-me"() { cmds.sudo("hire-me"); },
      matrix() { matrix(4000); print(`<span class="ac">wake up, neo…</span>`); },
      vim() { print(`<span class="warn">you are now trapped in vim.</span> <span class="dim">just kidding — type :q</span>`); },
      ":q"() { print(`<span class="dim">phew.</span>`); },
      exit() { print(`<span class="dim">there is no exit. only</span> <span class="ac">contact</span><span class="dim">.</span>`); },
      rm(...a) { print(a.join(" ").includes("-rf") ? `<span class="err">nope.</span> production systems are protected by humans-in-the-loop.` : `rm: permission denied`); },
      coffee() { print(`☕ brewing… throughput +12%`); },
      ping() { print(`PONG — latency <span class="ac">&lt; 1s</span>, as promised.`); },
    };
    cmds.exp = cmds.experience;
    cmds.work = cmds.experience;
    cmds.proj = cmds.projects;
    cmds.cv = cmds.resume;
    cmds.man = cmds.help;
    cmds["?"] = cmds.help;

    const VISIBLE = ["help", "about", "experience", "projects", "skills", "research", "neofetch", "resume", "contact", "email", "github", "linkedin", "ls", "cat", "theme", "clear", "history", "sudo"];

    const hist = [];
    let hIdx = 0;

    function run(raw) {
      const line = raw.trim();
      const head = echoCmd(line);
      if (!line) return;
      requestAnimationFrame(() => {
        const top = head.getBoundingClientRect().top - screen.getBoundingClientRect().top + screen.scrollTop - 12;
        if (screen.scrollHeight - top > screen.clientHeight) screen.scrollTop = top;
      });
      hist.push(line); hIdx = hist.length;
      gtag && gtag("event", "terminal_command", { command: line.split(/\s+/)[0] });
      const [name, ...args] = line.split(/\s+/);
      const fn = cmds[name.toLowerCase()];
      if (fn) fn(...args);
      else {
        const guess = VISIBLE.find(c => c.startsWith(name.toLowerCase().slice(0, 2)));
        print(`<span class="err">zsh: command not found:</span> ${esc(name)}${guess ? ` <span class="dim">— did you mean</span> <span class="ac">${guess}</span><span class="dim">?</span>` : ""}`);
      }
      print("");
    }

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") { run(input.value); input.value = ""; scroll(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); if (hIdx > 0) input.value = hist[--hIdx]; }
      else if (e.key === "ArrowDown") { e.preventDefault(); hIdx < hist.length - 1 ? input.value = hist[++hIdx] : (hIdx = hist.length, input.value = ""); }
      else if (e.key === "Tab") {
        e.preventDefault();
        const [first, ...rest] = input.value.split(" ");
        if (rest.length && (first === "cat" || first === "theme")) {
          const pool = first === "cat" ? Object.keys(FILES) : ["green", "amber", "ice", "mono"];
          const m = pool.filter(f => f.startsWith(rest.join(" ")));
          if (m.length === 1) input.value = `${first} ${m[0]}`;
          else if (m.length) print(m.join("   "), "ln dim");
          return;
        }
        const m = VISIBLE.filter(c => c.startsWith(input.value));
        if (m.length === 1) input.value = m[0] + " ";
        else if (m.length > 1) { echoCmd(input.value); print(m.join("   "), "ln dim"); }
      }
      else if (e.key === "l" && e.ctrlKey) { e.preventDefault(); cmds.clear(); }
    });

    document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { run(b.dataset.cmd); input.focus({ preventScroll: true }); }));
    screen.addEventListener("click", () => { if (!getSelection().toString()) input.focus({ preventScroll: true }); });
    document.addEventListener("keydown", e => {
      if (document.activeElement !== input && !e.metaKey && !e.ctrlKey && e.key.length === 1 && !row.hidden) input.focus();
    });

    const clock = document.getElementById("clock");
    const tick = () => clock.textContent = new Date().toLocaleTimeString("en-CA", { hour: "2-digit", minute: "2-digit", timeZone: "America/Toronto" }) + " ET";
    tick(); setInterval(tick, 30000);

    const saved = localStorage.getItem("theme");
    if (saved && saved !== "green") document.body.className = saved;

    function matrix(ms) {
      if (reduced) return;
      const c = document.getElementById("matrix"), x = c.getContext("2d");
      c.width = innerWidth; c.height = innerHeight;
      const fs = 16, cols = Math.ceil(c.width / fs), drops = Array(cols).fill(0).map(() => Math.random() * -40);
      const chars = "01アイウエオカキクケコサシスセソタチツテトAIMLLLMRAGvLLM";
      const color = getComputedStyle(document.body).getPropertyValue("--accent").trim();
      c.classList.add("on");
      let raf, start = performance.now();
      (function draw(t) {
        x.fillStyle = "rgba(7,9,12,.12)"; x.fillRect(0, 0, c.width, c.height);
        x.fillStyle = color; x.font = `${fs}px JetBrains Mono, monospace`;
        drops.forEach((y, i) => {
          x.fillText(chars[Math.floor(Math.random() * chars.length)], i * fs, y * fs);
          drops[i] = y * fs > c.height && Math.random() > .975 ? 0 : y + 1;
        });
        if (t - start < ms) raf = requestAnimationFrame(draw);
        else { c.classList.remove("on"); setTimeout(() => x.clearRect(0, 0, c.width, c.height), 700); }
      })(start);
    }

    async function boot() {
      const steps = [
        ["loading kernel modules", "pytorch vllm transformers"],
        ["mounting context layer", "messages · docs · entities · graphs"],
        ["spawning subagents", "4/4 ready"],
        ["warming KV cache", "hit-rate 0.97"],
        ["checking latency budget", "&lt; 1s ✓"],
      ];
      for (const [a, b] of steps) {
        await type(`<span class="dim">[</span><span class="ac">  ok  </span><span class="dim">]</span> ${a} <span class="dim">… ${b}</span>`, 4);
        await sleep(70);
      }
      await sleep(150);
      print(BANNER, "ascii");
      await type(`<span class="b">Staff AI Engineer @ Proofpoint</span> <span class="dim">·</span> agentic systems <span class="dim">·</span> speech agents <span class="dim">·</span> RAG <span class="dim">·</span> production LLM inference`, 8);
      print(`<span class="dim">type</span> <span class="ac">help</span> <span class="dim">or click a command above. try</span> <span class="ac">neofetch</span><span class="dim">.</span>`);
      print("");
      await sleep(250);
      echoCmd("about");
      cmds.about();
      print("");
      row.hidden = false;
      if (matchMedia("(pointer: fine)").matches) input.focus({ preventScroll: true });
      scroll();
    }
    boot();
  })();
  </script>
